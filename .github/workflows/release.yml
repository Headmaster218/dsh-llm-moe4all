name: Release

on:
  push:
    tags:
      - 'v*'
      - 'release-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validation
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dependency-cache
      - name: Select immutable tag or manual draft
        id: mode
        run: node ci/release-mode.mjs plan
      - name: Use pinned npm
        run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Build release assets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\build-release.ps1 -OutputDirectory dist -ExpectedTag '${{ steps.mode.outputs.tag }}'
          & .\scripts\check-release.ps1 -OutputDirectory dist
          & node scripts/release-notes.mjs '${{ steps.mode.outputs.tag }}' dist/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release notes generation failed' }
      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/release-mode.mjs publish
