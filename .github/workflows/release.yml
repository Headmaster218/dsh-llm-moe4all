name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run check
      - name: Build release assets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\build-release.ps1 -OutputDirectory dist -ExpectedTag $env:GITHUB_REF_NAME
      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = & node -p "require('./package.json').version"
          $arguments = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            'dist\dsh-llm-moe4all.tgz',
            'dist\dsh-llm-moe4all-windows.zip',
            'dist\SHA256SUMS.txt',
            '--title', "dsh-llm-moe4all $version",
            '--generate-notes'
          )
          if ($version.Contains('-')) { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed' }
