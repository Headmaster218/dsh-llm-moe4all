name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - dsh-version: 0.1.1-rc.2
            cordis-version: 4.0.1
            schemastery-version: 3.18.1
          - dsh-version: 0.1.5-rc.3
            cordis-version: 4.0.2
            schemastery-version: 3.18.2
          - dsh-version: 0.2.0-rc.2
            cordis-version: 4.0.4
            schemastery-version: 3.18.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Install DSH compatibility line
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dshVersion = '${{ matrix.dsh-version }}'
          $dshPackages = @(
            '@deepseek-ai/cordis@${{ matrix.cordis-version }}'
            '@deepseek-ai/schemastery@${{ matrix.schemastery-version }}'
            "@deepseek-ai/dsh-client-locale@$dshVersion"
            '@deepseek-ai/dsh-client-runtime@0.1.1-rc.2'
            "@deepseek-ai/dsh-client-ui-settings@$dshVersion"
            "@deepseek-ai/dsh-client-ui-slots@$dshVersion"
            "@deepseek-ai/dsh-credentials@$dshVersion"
            "@deepseek-ai/dsh-host-webserver@$dshVersion"
            "@deepseek-ai/dsh-llm-pi-ai@$dshVersion"
            "@deepseek-ai/dsh-settings@$dshVersion"
          )
          & npm install --no-save --package-lock=false --legacy-peer-deps @dshPackages
          if ($LASTEXITCODE -ne 0) { throw "DSH $dshVersion compatibility install failed" }
          $expectedVersions = @{
            'cordis' = '${{ matrix.cordis-version }}'
            'schemastery' = '${{ matrix.schemastery-version }}'
            'dsh-client-locale' = $dshVersion
            'dsh-client-runtime' = '0.1.1-rc.2'
            'dsh-client-ui-settings' = $dshVersion
            'dsh-client-ui-slots' = $dshVersion
            'dsh-credentials' = $dshVersion
            'dsh-host-webserver' = $dshVersion
            'dsh-llm-pi-ai' = $dshVersion
            'dsh-settings' = $dshVersion
          }
          foreach ($entry in $expectedVersions.GetEnumerator()) {
            $manifestPath = Join-Path 'node_modules\@deepseek-ai' "$($entry.Key)\package.json"
            $actualVersion = (Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json).version
            if ($actualVersion -ne $entry.Value) {
              throw "Expected @deepseek-ai/$($entry.Key) $($entry.Value), found $actualVersion"
            }
          }
      - run: npm run check
      - name: Verify committed build output
        if: matrix.dsh-version == '0.2.0-rc.2'
        run: git diff --exit-code -- lib
      - name: Verify official plugin-manager installation
        if: matrix.dsh-version == '0.1.1-rc.2' || matrix.dsh-version == '0.2.0-rc.2'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & npm install --global pnpm@11.7.0
          if ($LASTEXITCODE -ne 0) { throw 'Installing pinned pnpm failed' }
          $root = Join-Path $env:RUNNER_TEMP 'dsh-plugin-install-smoke'
          $runtime = Join-Path $root 'runtime'
          $dshHome = Join-Path $root 'home'
          New-Item -ItemType Directory -Path $runtime, $dshHome -Force | Out-Null

          & npm install --prefix $runtime --no-audit --no-fund '@deepseek-ai/dsh@${{ matrix.dsh-version }}'
          if ($LASTEXITCODE -ne 0) { throw 'Installing the official DSH runtime failed' }

          $archive = (& npm pack --ignore-scripts --json | ConvertFrom-Json).filename
          if ($LASTEXITCODE -ne 0) { throw 'Packing the plugin failed' }
          $archive = (Resolve-Path -LiteralPath $archive).Path
          $entry = Join-Path $runtime 'node_modules\@deepseek-ai\dsh\lib\bin.js'
          $env:DSH_HOME = $dshHome
          $env:DSH_AGENTS_HOME = Join-Path $root 'agents'

          & node $entry --profile web --dump-config | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Initializing the official DSH web profile failed' }
          & node $entry plugin --profile web add $archive
          if ($LASTEXITCODE -ne 0) { throw 'The official DSH plugin manager rejected the plugin' }
          & node $entry --profile web --dump-config | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'The installed plugin failed DSH config composition' }
          & node scripts/smoke-official-dsh.mjs $entry $dshHome
          if ($LASTEXITCODE -ne 0) { throw 'The installed plugin failed the official DSH runtime smoke test' }
          $updateHome = Join-Path $root 'release-update-home'
          & node scripts/smoke-plugin-release-update.mjs $entry $updateHome $archive
          if ($LASTEXITCODE -ne 0) { throw 'The GitHub Release self-update runtime smoke failed' }
