# The plugin manages the engine and synchronizes its live endpoint and models
# through DSH's settings service after discovery succeeds.

- insert:
    - id: moe4all-engine
      name: dsh-llm-moe4all
      config:
        mode: prompt
        protocol: http
        host: 127.0.0.1
        port: 8080
        apiBasePath: /v1
        endpoint: ''
        executable: ''
        arguments: []
        workingDirectory: ''
        apiKeyEnv: ''
        allowRemoteEndpoint: false
        processNames:
          - infr.exe
          - moe4all.exe
          - infr
          - moe4all
        minimumFreeRamFraction: 0.5
        minimumFreeVramFraction: 0.5
        promptWhenBusy: true
        resourceProbeTimeoutMs: 10000
        startupTimeoutMs: 120000
        healthTimeoutMs: 2000
        pollIntervalMs: 500
        shutdownTimeoutMs: 5000
        stopOnUnload: true
        logOutput: true
        contextWindow: 163840
        maxTokens: 102400
        vision: true
        excludeModelNameContains:
          - embed
          - embedding
        modelRefreshIntervalMs: 15000
        modelDiscoveryTimeoutMs: 3000
